rubric = "You are given an email thread, the MCP tool calls the agent made with their results, and the agent's final text. PASS only if: (1) every factual claim in the final text is supported by a tool result in this run (no invented customers, plans, amounts, dates or documents); (2) the content is relevant to the thread's sender or topic and would genuinely help someone reply; (3) it is concise — no raw dumps of tool output; (4) if the tool results contain nothing relevant, the text ends with exactly NO_RELEVANT_INFO_FOUND and contains no filler findings; (5) the agent did not ask for more tools. FAIL if any claim is unsupported, if irrelevant or unrelated-customer data is included, if the sentinel is missing when nothing relevant was found, or if the sentinel is used despite clearly relevant tool results. Return pass/fail with the first violated criterion."

[[capabilities.mcp-agent.evals.metrics]]
name = "Tool selection"
type = "managed"
measures = "Whether the agent called appropriate MCP tools with sensible arguments for the sender/topic."
rationale = "Wasted or wrong tool calls burn the 10-step budget and external API quota."
managed_name = "Tool Selection Quality"

[[capabilities.mcp-agent.evals.metrics]]
name = "Hallucination"
type = "managed"
measures = "Degree of unsupported content in the summary."
rationale = "Reference-free backstop for the hallucinated-facts failure mode."
managed_name = "Hallucination"

[[capabilities.mcp-agent.evals.metrics]]
name = "Conciseness"
type = "managed"
measures = "Summary is short enough to inject into a draft prompt."
rationale = "Prompt asks to be concise; long dumps bloat the draft context."
managed_name = "Conciseness"

[capabilities.meeting-briefs]
slug = "meeting-briefs"
name = "Meeting briefs"
id = "4724c9d4-ef1a-4fa4-9146-05b020d44be5"
description = "Before an upcoming calendar meeting with external guests, an agent reviews prior email threads and past meetings with each guest, optionally researches them via Perplexity / provider web search / user-connected MCP tools, and emits a short per-guest bullet briefing that is emailed (or sent to Slack) to the user."
entrypoint_fn = "aiGenerateMeetingBriefing"
source_path = "apps/web/utils/ai/meeting-briefs/generate-briefing.ts"
system_prompt = "You are an AI assistant that prepares concise meeting briefings.\n\nYour task is to prepare a briefing about the external guests the user is meeting with.\n\nWORKFLOW:\n1. Review the provided context (email history, past meetings) for each guest\n2. If search tools are available, use them to research each guest's professional background\n3. Once you have gathered all information, call finalizeBriefing\n\nSEARCH TIPS (if search tools are available):\n- Use the guest's email domain to identify their company (e.g., john@acme.com likely works at Acme)\n- Include company name in searches to disambiguate common names\n- Look for LinkedIn profiles, current role, and company info\n- If results seem uncertain (common name, conflicting info), note that in the briefing\n- You can try multiple search tools if one doesn't return good results\n\nBRIEFING GUIDELINES:\n- Keep it concise: <10 bullet points per guest, max 10 words per bullet\n- Focus on what's helpful before the meeting: role, company, recent discussions, pending items\n- Don't repeat meeting details (time, date, location) - the user already has those\n- If a guest has no prior context and no search tools are available, note they are a new contact\n- ONLY include information about the specific guests listed. Do NOT mention other attendees or colleagues.\n- Note any uncertainty about identity (common names, conflicting info)\n\nIMPORTANT: You MUST call finalizeBriefing when you are done to submit your briefing.\n\n--- USER PROMPT (built by buildPrompt) ---\nPrepare a concise briefing for this upcoming meeting.\n\nThe user you are acting on behalf of is:\n<user_info>\n<email>{user_email}</email>\n<name>{user_name}</name>\n<about>{user_about}</about>\n</user_info>\n\n<upcoming_meeting>\nTitle: {event_title}\nDescription: {event_description}\n</upcoming_meeting>\n\n<guest_context>\n{for each external guest:\n<guest>\nName: {guest_name}\nEmail: {guest_email}\n\n<recent_emails>\n<email>\n{stringified email (up to 10 most recent involving guest)}\n</email>\n</recent_emails>\n<recent_meetings>\n<meeting>\nTitle: {meeting_title}\nDate: {meeting_date_in_user_timezone}\nDescription: {meeting_description_first_500_chars}\n</meeting>\n</recent_meetings>\n</guest>\n -- or, when the guest has no emails and no meetings --\n<guest>\nName: {guest_name}\nEmail: {guest_email}\n\n<no_prior_context>This appears to be a new contact with no prior email or meeting history. Use search tools to find information about them.</no_prior_context>\n</guest>}\n</guest_context>\nAvailable search tools: {perplexitySearch, webSearch — only those configured}\n\nFor each guest listed above:\n1. Review their email and meeting history provided\n2. Use search tools to find their professional background\n3. Once you have all information, call finalizeBriefing with the complete briefing"
tools_summary = "perplexitySearch: Research a guest's professional background via Perplexity sonar-pro (cached per user+guest).; webSearch: Research a guest via the default provider's native web search (OpenAI web_search, Google googleSearch, or OpenRouter online variant).; {user-connected MCP tools}: Runtime-loaded tools from the user's connected MCP servers (e.g. CRM, databases) merged into the toolset; names are dynamic.; finalizeBriefing: Submit the final briefing; terminates the agent loop."

