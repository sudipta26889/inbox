[[capabilities.rules-from-prompt.eval_matrix]]
name = "Prompt-to-rule fidelity"
type = "llm_judge_custom"
rubric = "You are given a user's email-automation prompt and the structured rules produced from it (name, condition {conditionalOperator, aiInstructions, static{from,to,subject}}, actions [{type, fields, delayInMinutes}]). PASS only if ALL hold: (1) every distinct instruction in the prompt maps to exactly one rule, and no rule exists that the prompt did not ask for; (2) each rule's conditions capture the instruction's intent — semantic criteria in aiInstructions, exact sender addresses/domains in static.from (a pure sender/domain list must NOT be in aiInstructions); AND/OR is used correctly when both are present; (3) actions match what was asked — correct types, label names spelled as in the prompt, recipients present for SEND_EMAIL/FORWARD, no calendar/todo or other invented actions; (4) any snippet or template the user supplied is copied verbatim into fields.content without added placeholders; (5) rule names are short (ideally one word). FAIL if any instruction is dropped, merged with another, mis-scoped (wrong sender, wrong condition), given extra or wrong actions, or if template text is paraphrased. For edit flows, also FAIL if an edited rule is treated as removed+added. Return pass/fail with the first violated criterion."
measures = "Whether the generated rules faithfully and completely encode the user's natural-language instructions."
rationale = "Guards the core failure modes: dropped/invented rules, sender lists in aiInstructions, wrong actions and paraphrased snippets."
managed_name = ""
requires_reference = false

