[capabilities.sender-categorization]
slug = "sender-categorization"
name = "Sender categorization"
id = "ffbc5026-793c-4635-927d-4e104dbe14f1"
description = "Assigns each email sender to one of the user's sender categories (e.g. Newsletter, Receipt, Marketing, Other) from the sender address and up to 3 recent subjects/snippets. Runs in bulk from the Smart Categories batch queue, per-sender from the UI action, and automatically on new incoming mail when auto-categorize is on; categories feed category filters in AI rules."
entrypoint_fn = "categorizeSender"
source_path = "apps/web/utils/categorize/senders/categorize.ts"
system_prompt = "--- system ---\nYou are an AI assistant specializing in email management and organization.\nYour task is to categorize an email accounts based on their name, email address, and content from previous emails.\nProvide an accurate categorization to help users efficiently manage their inbox.\n\n--- user prompt ---\nCategorize the following email account:\n{sender}\n\nPrevious emails from them:\n{for each of up to 3: <email><subject>{subject}</subject><snippet>{snippet}</snippet></email>}\n{\"No previous emails found\" when none}\n\n<categories>\n{for each category: - {name}: {description}}\n</categories>\n\n<instructions>\n1. Analyze the sender's name and email address for clues about their category.\n2. Review the content of previous emails to gain more context about the account's relationship with us.\n3. If the category is clear, assign it.\n4. If you're not certain, respond with \"Unknown\".\n5. If multiple categories are possible, respond with \"Unknown\".\n6. Return your response in JSON format.\n</instructions>"
