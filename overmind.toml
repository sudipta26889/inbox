type = "llm_judge_custom"
rubric = "You are given the email summaries (received and sent), the Gmail labels, and the generated report. PASS only if ALL hold: (1) the persona is a specific professional role (not 'Professional', 'Business Person', 'Tech Worker', 'Knowledge Worker') and is consistent between executiveSummary.userProfile.persona and userPersona.professionalIdentity.persona; (2) supportingEvidence and topInsights refer to topics/senders actually present in the summaries; (3) label optimizationSuggestions refer to existing label names when proposing consolidate/rename/delete; (4) categoryOrganization contains no generic categories (Other, Unknown, Misc, Personal, General, Random, Various); (5) suggestedTemplates plausibly reflect the user's sent-email patterns; (6) actionableRecommendations, when present, are concrete and tied to the stated priorities. FAIL if any section contains claims unsupported by the inputs, contradictory personas, generic categories, or vague non-actionable advice."
