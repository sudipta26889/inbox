[capabilities.assistant-chat.capability_card.vocabulary]
A2A = "agent-to-agent protocol; peers get read-only answers"
rule = "automation: condition (AI instructions and/or static from/to/subject) + actions"
"Reply Zero" = "feature labelling emails 'To Reply' / 'Awaiting'"
"knowledge base" = "content used for DRAFT_REPLY when no preset draft"
"pending action" = "prepared send/reply/forward awaiting user confirmation in UI"
"learned patterns" = "per-rule include/exclude sender/subject patterns that override conditional logic"
"conversation status" = "To Reply, FYI, Awaiting Reply, Actioned system rules"
"Personal Instructions" = "durable 'about' context used when AI processes future emails"

