task = "Compile a natural-language email-automation prompt into structured rules (name, condition, actions) and reconcile them with the user's existing rules."
modes = []
domain = "email inbox automation rule authoring"
anchors = []
modality = "text"
_fallback = false
tool_spec = []
failure_modes = [
    "edited rule classified as removed + added (duplicates or lost history)",
    "sender list placed in aiInstructions instead of static.from",
    "invented actions (e.g. SEND_EMAIL without recipient, calendar/todo actions)",
    "verbose rule names or merged unrelated instructions",
    "find-existing maps a prompt rule to the wrong ruleId, editing the wrong rule",
