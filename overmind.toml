name = "Grounded, relevant research"
type = "llm_judge_custom"
rubric = "You are given an email thread, the MCP tool calls the agent made with their results, and the agent's final text. PASS only if: (1) every factual claim in the final text is supported by a tool result in this run (no invented customers, plans, amounts, dates or documents); (2) the content is relevant to the thread's sender or topic and would genuinely help someone reply; (3) it is concise — no raw dumps of tool output; (4) if the tool results contain nothing relevant, the text ends with exactly NO_RELEVANT_INFO_FOUND and contains no filler findings; (5) the agent did not ask for more tools. FAIL if any claim is unsupported, if irrelevant or unrelated-customer data is included, if the sentinel is missing when nothing relevant was found, or if the sentinel is used despite clearly relevant tool results. Return pass/fail with the first violated criterion."
measures = "Whether the summary contains only tool-grounded facts relevant to the email's sender/topic, or correctly returns the no-info sentinel."
rationale = "Hallucinated or irrelevant context flows straight into reply drafts."
