[[capabilities.document-filing.eval_matrix]]
name = "Filing decision fits user preferences"
type = "llm_judge_custom"
rubric = "You grade ONE filing decision. Inputs: the user's filing preferences, document metadata (filename, email subject, sender), extracted text (may be empty), the list of existing folders (id + path), and the model output {action, folderId, folderPath, confidence, reasoning}. For filing-reply rows, inputs are the user's reply plus filename/current folder and the output {action, folderPath, reply}.\nFiling rows PASS only if ALL hold:\n1. If the document does not match the filing preferences, action is 'skip'.\n2. If it matches and an appropriate existing folder exists, action is 'use_existing' with a folderId that appears in the provided list and is the most specific fitting folder.\n3. 'create_new' is used only when no existing folder fits, and folderPath follows the user's stated organisation scheme (e.g. by vendor/year) without duplicating an existing folder.\n4. Confidence is calibrated: >=0.9 only for unambiguous matches; uncertain matches are below 0.7.\n5. Reasoning names the document type/entity that justified the decision.\nFiling-reply rows PASS only if: the action matches the user's evident intent (approval -> approve, new location -> move with that folderPath, reversal/removal -> undo, question/chat -> none), and the reply is concise and consistent with the action.\nFAIL otherwise, naming the violated criterion."
measures = "Whether the chosen action/folder (or reply interpretation) is the right one given the user's filing preferences, document and folder list."
rationale = "Core failure modes are mis-filing unrelated documents, inventing folders, and overconfident scores that bypass the <0.7 ask gate."
managed_name = ""
requires_reference = false

