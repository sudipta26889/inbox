openapi: 3.1.0
info:
  title: Inbox A2A Protocol API
  version: 1.0.0
  description: |
    # Inbox A2A Protocol API

    Agent-to-Agent Protocol v0.3 implementation for email and calendar automation.

    ## Overview

    The A2A Protocol enables AI agents to interact with the Inbox email automation
    platform through a standardized JSON-RPC 2.0 interface over HTTPS.

    ## Authentication

    OAuth 2.0 Authorization Code flow with PKCE (RFC 7636)

    ## Rate Limits

    - **Client**: 60 requests/minute, 1000 requests/hour
    - **User**: 100 requests/minute, 2000 requests/hour
    - **Task Creation**: 30 requests/minute, 500 requests/hour
    - **IP (unauthenticated)**: 20 requests/minute, 200 requests/hour

    Rate limit headers are included in all responses:
    - `X-RateLimit-Limit`: Maximum requests allowed
    - `X-RateLimit-Remaining`: Requests remaining in current window
    - `X-RateLimit-Reset`: Unix timestamp when limit resets
    - `Retry-After`: Seconds to wait before retrying (when rate limited)

    ## AgentCard Discovery

    Discover agent capabilities at `GET /.well-known/agent-card.json`

  contact:
    name: Inbox Support
    url: https://inbox.sudiptadhara.in/help
  license:
    name: MIT

servers:
  - url: https://inbox.sudiptadhara.in
    description: Production server

tags:
  - name: Discovery
    description: Agent capability discovery
  - name: A2A Protocol
    description: JSON-RPC 2.0 task management
  - name: OAuth
    description: OAuth 2.0 authentication

paths:
  /.well-known/agent-card.json:
    get:
      tags:
        - Discovery
      summary: Get AgentCard
      description: |
        Discover agent capabilities, skills, OAuth configuration, and protocol bindings.

        The AgentCard follows the A2A Protocol v0.3 specification and includes:
        - Agent metadata (name, version, description)
        - Available skills with input/output schemas
        - OAuth 2.0 configuration with scopes
        - Protocol bindings (JSON-RPC, SSE)
        - Capabilities (streaming, HITL, state history)
      operationId: getAgentCard
      responses:
        '200':
          description: AgentCard metadata
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600, must-revalidate
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: "*"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCard'
              example:
                name: Inbox Email Automation Agent
                version: "1.0.0"
                description: AI-powered email and calendar automation
                url: https://inbox.sudiptadhara.in
                capabilities:
                  streaming: true
                  pushNotifications: false
                  humanInTheLoop: true
                  stateTransitionHistory: true
                skills:
                  - name: email.search
                    description: Search emails across all accounts
                    inputModes: [text, structured_data]
                    outputModes: [structured_data]
                    category: email_management
                security:
                  type: oauth2
                  flows:
                    authorizationCode:
                      authorizationUrl: /mcp-server/authorize
                      tokenUrl: /mcp-server/token
                      scopes:
                        email:read: Read emails and search inbox
                        email:write: Send emails and modify labels

  /a2a:
    post:
      tags:
        - A2A Protocol
      summary: A2A JSON-RPC Endpoint
      description: |
        Execute A2A protocol methods via JSON-RPC 2.0 over HTTPS.

        Supported methods:
        - `initialize`: Discover server capabilities (no auth required)
        - `message.send`: Create tasks or send messages
        - `task.get`: Get task status and results
        - `task.list`: List tasks in a context
        - `task.cancel`: Cancel a running task
        - `context.get`: Get conversation history

      operationId: a2aJsonRpc
      security:
        - OAuth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              initialize:
                summary: Initialize connection
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
              message_send:
                summary: Create a task (email search)
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: message.send
                  params:
                    contextId: ctx_abc123
                    skill: email.search
                    input:
                      query: from:john@example.com
                      maxResults: 10
              task_get:
                summary: Get task status
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: task.get
                  params:
                    taskId: task_xyz789
              task_list:
                summary: List tasks in context
                value:
                  jsonrpc: "2.0"
                  id: 4
                  method: task.list
                  params:
                    contextId: ctx_abc123
                    state: completed
                    limit: 50
              task_cancel:
                summary: Cancel a task
                value:
                  jsonrpc: "2.0"
                  id: 5
                  method: task.cancel
                  params:
                    taskId: task_xyz789
                    reason: User requested cancellation
              context_get:
                summary: Get conversation history
                value:
                  jsonrpc: "2.0"
                  id: 6
                  method: context.get
                  params:
                    contextId: ctx_abc123
                    limit: 100
      responses:
        '200':
          description: JSON-RPC response
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
              examples:
                success:
                  summary: Successful response
                  value:
                    jsonrpc: "2.0"
                    id: 2
                    result:
                      contextId: ctx_abc123
                      taskId: task_xyz789
                      state: submitted
                error:
                  summary: Error response
                  value:
                    jsonrpc: "2.0"
                    id: 2
                    error:
                      code: -32602
                      message: Invalid params
        '401':
          description: Unauthorized - Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcError'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcError'

  /a2a/stream:
    get:
      tags:
        - A2A Protocol
      summary: SSE Streaming Endpoint
      description: |
        Subscribe to real-time task updates via Server-Sent Events (SSE).

        Events:
        - `connected`: Connection established
        - `state`: Task state changed
        - `final`: Task reached terminal state (completed/failed/canceled)

      operationId: a2aStream
      security:
        - OAuth2: []
      parameters:
        - name: taskId
          in: query
          required: true
          schema:
            type: string
          description: Task ID to monitor
      responses:
        '200':
          description: SSE stream
          headers:
            Content-Type:
              schema:
                type: string
                example: text/event-stream
            Cache-Control:
              schema:
                type: string
                example: no-cache
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: connected
                  data: {"taskId":"task_xyz789"}

                  event: state
                  data: {"state":"working","stateReason":"Executing task"}

                  event: final
                  data: {"state":"completed","result":{"emails":[]}}
        '401':
          description: Unauthorized
        '404':
          description: Task not found

  /mcp-server/authorize:
    get:
      tags:
        - OAuth
      summary: OAuth Authorization Endpoint
      description: |
        Initiate OAuth 2.0 authorization code flow with PKCE.

        The user will be redirected to a login page to authorize the client.
        After authorization, the user is redirected back to the `redirect_uri`
        with an authorization code.

      operationId: oauthAuthorize
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: OAuth client ID
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: Redirect URI (must match registered URI)
        - name: scope
          in: query
          required: true
          schema:
            type: string
            example: email:read email:write calendar:read
          description: Space-separated list of scopes
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: CSRF protection token
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
          description: PKCE code challenge (base64url-encoded SHA256 hash)
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
          description: PKCE challenge method (only S256 supported)
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
      responses:
        '302':
          description: Redirect to authorization page
          headers:
            Location:
              schema:
                type: string

  /mcp-server/token:
    post:
      tags:
        - OAuth
      summary: OAuth Token Endpoint
      description: |
        Exchange authorization code for access token, or refresh an expired token.

      operationId: oauthToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TokenRequestAuthorizationCode'
                - $ref: '#/components/schemas/TokenRequestRefreshToken'
            examples:
              authorization_code:
                summary: Exchange authorization code
                value:
                  grant_type: authorization_code
                  code: auth_code_abc123
                  redirect_uri: https://example.com/callback
                  client_id: client_abc123
                  client_secret: secret_xyz789
                  code_verifier: pkce_verifier_string
              refresh_token:
                summary: Refresh access token
                value:
                  grant_type: refresh_token
                  refresh_token: refresh_token_abc123
                  client_id: client_abc123
                  client_secret: secret_xyz789
      responses:
        '200':
          description: Access token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid client credentials

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /mcp-server/authorize
          tokenUrl: /mcp-server/token
          scopes:
            email:read: Read emails and search inbox
            email:write: Send emails and modify labels
            calendar:read: Read calendar events and availability
            calendar:write: Create and modify calendar events
            stats:read: Access email statistics and analytics
            rules:read: Read automation rules
            rules:write: Create and modify automation rules
            ai:analyze: Use AI analysis features

  headers:
    X-RateLimit-Limit:
      schema:
        type: integer
      description: Maximum requests allowed in current window
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: Requests remaining in current window
    X-RateLimit-Reset:
      schema:
        type: integer
      description: Unix timestamp when rate limit resets

  schemas:
    AgentCard:
      type: object
      required:
        - name
        - version
        - url
        - skills
        - security
        - bindings
      properties:
        name:
          type: string
          example: Inbox Email Automation Agent
        description:
          type: string
        version:
          type: string
          example: "1.0.0"
        url:
          type: string
          format: uri
        provider:
          type: object
          properties:
            name:
              type: string
            url:
              type: string
            supportUrl:
              type: string
        capabilities:
          type: object
          properties:
            streaming:
              type: boolean
            pushNotifications:
              type: boolean
            humanInTheLoop:
              type: boolean
            stateTransitionHistory:
              type: boolean
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        security:
          type: object
        bindings:
          type: array
          items:
            type: object

    Skill:
      type: object
      required:
        - name
        - description
        - inputModes
        - outputModes
      properties:
        name:
          type: string
          example: email.search
        description:
          type: string
        inputModes:
          type: array
          items:
            type: string
            enum: [text, structured_data, data_parts]
        outputModes:
          type: array
          items:
            type: string
        inputSchema:
          type: object
        category:
          type: string

    JsonRpcRequest:
      type: object
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: number
        method:
          type: string
          enum:
            - initialize
            - message.send
            - task.get
            - task.list
            - task.cancel
            - context.get
        params:
          type: object

    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
        error:
          $ref: '#/components/schemas/JsonRpcError'

    JsonRpcError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: |
            Error codes:
            - -32700: Parse error
            - -32600: Invalid Request
            - -32601: Method not found
            - -32602: Invalid params
            - -32603: Internal error
            - -32002: Authentication required
            - -32003: Rate limit exceeded
        message:
          type: string
        data:
          type: object

    TokenRequestAuthorizationCode:
      type: object
      required:
        - grant_type
        - code
        - redirect_uri
        - client_id
        - client_secret
        - code_verifier
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
        redirect_uri:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        code_verifier:
          type: string

    TokenRequestRefreshToken:
      type: object
      required:
        - grant_type
        - refresh_token
        - client_id
        - client_secret
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
        client_id:
          type: string
        client_secret:
          type: string

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Token lifetime in seconds
        refresh_token:
          type: string
        scope:
          type: string
