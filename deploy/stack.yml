# Production on the NUC: Git-backed stack inbox-prod on NAS Portainer, endpoint 11.
# Git stacks cannot use env_file, so a new env key goes in .env, .env.example,
# here as ${KEY:-}, and in the stack Env.
name: inbox-prod
services:
  web:
    image: ghcr.io/sudipta26889/inbox-web:${IMAGE_TAG:-latest}
    ports:
      - "5500:5500"
    environment:
      NODE_ENV: "production"
      # Node 24 races IPv6/IPv4 with a 250 ms per-attempt budget. IPv6 is
      # unreachable from this host and Telegram's IPv4 answers slower than that,
      # so every fetch to api.telegram.org timed out (ETIMEDOUT).
      NODE_OPTIONS: "--network-family-autoselection-attempt-timeout=2000"
      INTERNAL_API_URL: "http://web:5500"
      WEBHOOK_ALLOW_PRIVATE_IPS: "false"
      NEXT_PUBLIC_BASE_URL: "https://inbox.sudiptadhara.in"
      DHARAHIL_BASE_URL: "https://dharahil-gateway.sudiptadhara.in"
      DHARAHIL_TENANT_ID: "0ff30ba6-44c0-4c1b-89e6-5936cca0cc29"
      DHARAHIL_APP_ID: "69938d75-c4e7-4715-b575-0fb29da4b9ce"
      DHARAHIL_ENVIRONMENT: "production"
      A2A_FANOUT_ALL_EMAILS: ${A2A_FANOUT_ALL_EMAILS:-}
      A2A_REMOTE_AGENTS: ${A2A_REMOTE_AGENTS:-}
      A2A_REMOTE_AGENT_TOKEN: ${A2A_REMOTE_AGENT_TOKEN:-}
      ADMINS: ${ADMINS:-}
      API_KEY_SALT: ${API_KEY_SALT:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DECISION_ESCALATION_MODEL: ${DECISION_ESCALATION_MODEL:-}
      DECISION_LIVE_AUDIT: ${DECISION_LIVE_AUDIT:-}
      DECISION_MIN_CONFIDENCE: ${DECISION_MIN_CONFIDENCE:-}
      DECISION_MODEL_LIVE: ${DECISION_MODEL_LIVE:-}
      DEFAULT_DECISION_MODEL: ${DEFAULT_DECISION_MODEL:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-}
      DHARAHIL_API_KEY: ${DHARAHIL_API_KEY:-}
      DIRECT_URL: ${DIRECT_URL:-}
      EMAIL_ENCRYPT_SALT: ${EMAIL_ENCRYPT_SALT:-}
      EMAIL_ENCRYPT_SECRET: ${EMAIL_ENCRYPT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_PUBSUB_TOPIC_NAME: ${GOOGLE_PUBSUB_TOPIC_NAME:-}
      GOOGLE_PUBSUB_VERIFICATION_TOKEN: ${GOOGLE_PUBSUB_VERIFICATION_TOKEN:-}
      HEALTH_API_KEY: ${HEALTH_API_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LONGMEMORY_API_KEY: ${LONGMEMORY_API_KEY:-}
      LONGMEMORY_BASE_URL: ${LONGMEMORY_BASE_URL:-}
      MEETECHO_A2A_TOKEN: ${MEETECHO_A2A_TOKEN:-}
      MEETECHO_INBOX_INGEST_URL: ${MEETECHO_INBOX_INGEST_URL:-}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_PORT: ${MQTT_PORT:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-}
      NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS: ${NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS:-}
      NEXT_PUBLIC_DELETE_EMAIL_ACTION_ENABLED: ${NEXT_PUBLIC_DELETE_EMAIL_ACTION_ENABLED:-}
      NEXT_PUBLIC_DHARAHIL_ENABLED: ${NEXT_PUBLIC_DHARAHIL_ENABLED:-}
      NEXT_PUBLIC_DIGEST_ENABLED: ${NEXT_PUBLIC_DIGEST_ENABLED:-}
      NEXT_PUBLIC_EMAIL_SEND_ENABLED: ${NEXT_PUBLIC_EMAIL_SEND_ENABLED:-}
      NEXT_PUBLIC_EXTERNAL_API_ENABLED: ${NEXT_PUBLIC_EXTERNAL_API_ENABLED:-}
      NEXT_PUBLIC_FOLLOW_UP_REMINDERS_ENABLED: ${NEXT_PUBLIC_FOLLOW_UP_REMINDERS_ENABLED:-}
      NEXT_PUBLIC_MCP_SERVER_ENABLED: ${NEXT_PUBLIC_MCP_SERVER_ENABLED:-}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:-}
      OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OVERMIND_API_KEY: ${OVERMIND_API_KEY:-}
      OVERMIND_API_URL: ${OVERMIND_API_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      TASKPILOT_DECIDER_FALLBACK_MODEL: ${TASKPILOT_DECIDER_FALLBACK_MODEL:-}
      TASKPILOT_DECIDER_MAX_TOKENS: ${TASKPILOT_DECIDER_MAX_TOKENS:-}
      TASKPILOT_DECIDER_MODEL: ${TASKPILOT_DECIDER_MODEL:-}
      TASKPILOT_DECIDER_REASONING_EFFORT: ${TASKPILOT_DECIDER_REASONING_EFFORT:-}
      TASKPILOT_DECIDER_TIMEOUT_MS: ${TASKPILOT_DECIDER_TIMEOUT_MS:-}
      TASKPILOT_DECISIONS_SHADOW: ${TASKPILOT_DECISIONS_SHADOW:-}
      TASKPILOT_FIELDS_MAX_TOKENS: ${TASKPILOT_FIELDS_MAX_TOKENS:-}
      TASKPILOT_FIELDS_MODEL: ${TASKPILOT_FIELDS_MODEL:-}
      TASKPILOT_FIELDS_REASONING_EFFORT: ${TASKPILOT_FIELDS_REASONING_EFFORT:-}
      TASKPILOT_PREGATE_RECALL_THRESHOLD: ${TASKPILOT_PREGATE_RECALL_THRESHOLD:-}
      TELEGRAM_BOT_SECRET_TOKEN: ${TELEGRAM_BOT_SECRET_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    restart: always
    networks:
      - inbox-network

  cron:
    image: alpine:latest
    command: >
      sh -c "
        apk add --no-cache curl &&
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/scheduled-actions' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/automation-jobs' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/follow-up-reminders' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 3600
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/resend/digest/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 1800
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/meeting-briefs' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/watch/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 21600
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/process-emails' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 1800
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/taskpilot-janitor' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 300
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/a2a-digest' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 600
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/a2a-tasks' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 60
          done
        ) &
        wait
      "
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      - web
    restart: always
    networks:
      - inbox-network

networks:
  inbox-network:
