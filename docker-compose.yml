name: inbox
services:
  web:
    # Off unless asked for: see "Dev and deploy" in AGENTS.md before starting this.
    profiles: ["next-dev"]
    # next dev forks workers; without an init, a dead one stays a zombie and blocks docker stop.
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    # Dev only. Never read .env here: on the dev machine it holds production values.
    env_file:
      - ./apps/web/.env.local
    ports:
      - "5500:5500"
    environment:
      INTERNAL_API_URL: "http://web:5500"
      NODE_OPTIONS: "--max-old-space-size=3072"
    volumes:
      # Mount source code for hot reload - code changes reflect immediately
      - ./apps/web:/app/apps/web:cached
      # Next.js auto-loads apps/web/.env from the mount; hide the production values.
      - /dev/null:/app/apps/web/.env:ro
      - ./packages:/app/packages:cached
      # Prevent node_modules from being overwritten by host mount
      - /app/node_modules
      - /app/apps/web/node_modules
      # Persist .next build cache across restarts
      - inbox-next-cache:/app/apps/web/.next
    networks:
      - inbox-network

  # Off by default: only runs with `--profile cron`.
  cron:
    profiles: ["cron"]
    image: alpine:latest
    command: >
      sh -c "
        apk add --no-cache curl &&
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/scheduled-actions' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/automation-jobs' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/follow-up-reminders' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 3600
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/resend/digest/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 1800
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/meeting-briefs' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/watch/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 21600
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/process-emails' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 1800
          done
        ) &
        wait
      "
    env_file:
      - ./apps/web/.env.local
    depends_on:
      - web
    networks:
      - inbox-network

volumes:
  inbox-next-cache:

networks:
  inbox-network:
