name: inbox
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    env_file:
      - ./apps/web/.env
    ports:
      - "5500:5500"
    environment:
      NEXT_PUBLIC_BASE_URL: "https://inbox.sudiptadhara.in"
      NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS: "true"
      NEXT_PUBLIC_MCP_SERVER_ENABLED: "true"
      DATABASE_URL: "postgresql://inbox_zero_user:fdJ5GJ6IYEwdar9gd94jAoFY@192.168.11.118:5432/inbox_zero_db?schema=public"
      DIRECT_URL: "postgresql://inbox_zero_user:fdJ5GJ6IYEwdar9gd94jAoFY@192.168.11.118:5432/inbox_zero_db?schema=public"
      REDIS_URL: "redis://:YyD0Tp54vIhmH9gyrbtDu7vDtv8zc5gL@192.168.11.118:6379/3"
      INTERNAL_API_URL: "http://web:5500"
    volumes:
      # Mount source code for hot reload - code changes reflect immediately
      - ./apps/web:/app/apps/web:cached
      - ./packages:/app/packages:cached
      # Prevent node_modules from being overwritten by host mount
      - /app/node_modules
      - /app/apps/web/node_modules
      # Persist .next build cache across restarts
      - inbox-next-cache:/app/apps/web/.next
    restart: always
    networks:
      - inbox-network

  cron:
    image: alpine:latest
    command: >
      sh -c "
        apk add --no-cache curl &&
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/scheduled-actions' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/automation-jobs' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/follow-up-reminders' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 3600
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/resend/digest/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 1800
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/meeting-briefs' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/watch/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 21600
          done
        ) &
        wait
      "
    env_file:
      - ./apps/web/.env
    depends_on:
      - web
    restart: always
    networks:
      - inbox-network

volumes:
  inbox-next-cache:

networks:
  inbox-network:
