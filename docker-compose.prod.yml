name: inbox-prod
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args:
        NEXT_PUBLIC_BASE_URL: "https://inbox.sudiptadhara.in"
        NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS: "true"
        NEXT_PUBLIC_MCP_SERVER_ENABLED: "true"
        NEXT_PUBLIC_EMAIL_SEND_ENABLED: "true"
        NEXT_PUBLIC_CLEANER_ENABLED: "false"
        NEXT_PUBLIC_AUTO_DRAFT_DISABLED: "false"
        NEXT_PUBLIC_MEETING_BRIEFS_ENABLED: "false"
        NEXT_PUBLIC_INTEGRATIONS_ENABLED: "false"
        NEXT_PUBLIC_DIGEST_ENABLED: "true"
        NEXT_PUBLIC_DELETE_EMAIL_ACTION_ENABLED: "false"
    image: inbox-prod:latest
    env_file:
      - ./apps/web/.env
    ports:
      - "5500:5500"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_BASE_URL: "https://inbox.sudiptadhara.in"
      NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS: "true"
      NEXT_PUBLIC_MCP_SERVER_ENABLED: "true"
      NEXT_PUBLIC_EMAIL_SEND_ENABLED: "true"
      NEXT_PUBLIC_DELETE_EMAIL_ACTION_ENABLED: "false"
      WEBHOOK_ALLOW_PRIVATE_IPS: "false"
      NEXT_PUBLIC_DHARAHIL_ENABLED: "true"
      DHARAHIL_BASE_URL: "https://dharahil-gateway.sudiptadhara.in"
      DHARAHIL_API_KEY: "dhara_sk_12f85b7abc1d1e23b83dd85c67e049271b91680edbc4d2787c59b42d8f83b6c9"
      DHARAHIL_TENANT_ID: "0ff30ba6-44c0-4c1b-89e6-5936cca0cc29"
      DHARAHIL_APP_ID: "69938d75-c4e7-4715-b575-0fb29da4b9ce"
      DHARAHIL_ENVIRONMENT: "production"
      DATABASE_URL: "postgresql://inbox_zero_user:fdJ5GJ6IYEwdar9gd94jAoFY@nuc.lan:5432/inbox_zero_db?schema=public"
      DIRECT_URL: "postgresql://inbox_zero_user:fdJ5GJ6IYEwdar9gd94jAoFY@nuc.lan:5432/inbox_zero_db?schema=public"
      REDIS_URL: "redis://:YyD0Tp54vIhmH9gyrbtDu7vDtv8zc5gL@nuc.lan:6379/3"
      INTERNAL_API_URL: "http://web:5500"
      # Required at runtime; values resolved from ./apps/web/.env (or host env).
      # `:?required` makes compose fail-fast on missing values instead of the
      # app booting and crashing later on first encryption/auth/LLM call.
      AUTH_SECRET: ${AUTH_SECRET:?required}
      EMAIL_ENCRYPT_SECRET: ${EMAIL_ENCRYPT_SECRET:?required}
      EMAIL_ENCRYPT_SALT: ${EMAIL_ENCRYPT_SALT:?required}
      API_KEY_SALT: ${API_KEY_SALT:?required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
      CRON_SECRET: ${CRON_SECRET:?required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?required}
      GOOGLE_PUBSUB_TOPIC_NAME: ${GOOGLE_PUBSUB_TOPIC_NAME:?required}
      GOOGLE_PUBSUB_VERIFICATION_TOKEN: ${GOOGLE_PUBSUB_VERIFICATION_TOKEN:?required}
      # LLM gateway
      LLM_API_KEY: ${LLM_API_KEY:?required}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:?required}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:?required}
      # Qdrant for taskpilot cross-thread semantic dedupe (optional feature;
      # mark non-required if you ever want to disable cleanly)
      QDRANT_URL: ${QDRANT_URL:?required}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?required}
    restart: always
    networks:
      - inbox-network

  cron:
    image: alpine:latest
    command: >
      sh -c "
        apk add --no-cache curl &&
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/scheduled-actions' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/automation-jobs' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/follow-up-reminders' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 3600
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/resend/digest/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 1800
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/meeting-briefs' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 900
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/watch/all' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 21600
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/process-emails' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 1800
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/taskpilot-janitor' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 300
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/a2a-digest' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 600
          done
        ) &
        (
          while true; do
            curl -s -X GET 'http://web:5500/api/cron/a2a-tasks' -H \"Authorization: Bearer $${CRON_SECRET}\" || true
            sleep 60
          done
        ) &
        wait
      "
    env_file:
      - ./apps/web/.env
    depends_on:
      - web
    restart: always
    networks:
      - inbox-network

networks:
  inbox-network:
